WINDOWS: double-click this file (Chrome or Edge). Needs internet for the three.js CDN scripts.
REAL MODELS (optional): put player.glb and enemy.glb in assets/models/ next to this file, then serve the folder

<script>

const $=i=>document.getElementById(i),M=Math,R=M.random,PI=M.PI,clamp=(v,a,b)=>M.max(a,M.min(b,v)),V3=THREE.Vector3,B=90;

/* ---------- renderer, scene, camera (light mode: no bloom, no mirror floor) ---------- */

scene.background=new THREE.Color(0x05070f);scene.fog=new THREE.FogExp2(0x180a38,.0036);

rs();

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x6f8cff,0x20103a,1.05));
const key=new THREE.DirectionalLight(0xa8d4ff,1.6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);

const rim=new THREE.DirectionalLight(0xe02bd8,.9);rim.position.set(-40,30,-60);scene.add(rim);
const pl=new THREE.PointLight(0x38bdf8,2.2,40),boomL=new THREE.PointLight(0xffaa55,0,50);scene.add(pl,boomL);

/* ---------- procedural textures ---------- */
function makeTex(s,fn,rep){const c=document.createElement("canvas");c.width=c.height=s;fn(c.getContext("2d"),s);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);t.anisotropy=8;return t}
const floorTex=makeTex(256,(g,s)=>{g.fillStyle="rgb(9,16,36)";g.fillRect(0,0,s,s);for(let i=0;i<900;i++){g.fillStyle=`rgba(140,180,255,${R()*.07})`;g.fillRect(R()*s,R()*s,2,2)}
 g.strokeStyle="rgba(70,110,180,.95)";g.lineWidth=5;g.strokeRect(0,0,s,s);g.lineWidth=1.5;g.strokeStyle="rgba(50,80,140,.6)";g.beginPath();g.moveTo(s/2,0);g.lineTo(s/2,s);g.moveTo(0,s/2);g.lineTo(s,s/2);g.stroke()},70);
const metalTex=makeTex(256,(g,s)=>{g.fillStyle="#141d30";g.fillRect(0,0,s,s);g.strokeStyle="#0a101d";g.lineWidth=4;for(let x=0;x<=s;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,s*.8);g.stroke()}
 g.fillStyle="#facc15";g.fillRect(0,s*.84,s,s*.16);g.fillStyle="#111";for(let x=-s;x<s*2;x+=32){g.beginPath();g.moveTo(x,s);g.lineTo(x+16,s);g.lineTo(x+46,s*.84);g.lineTo(x+30,s*.84);g.fill()}});
const winTex=makeTex(128,(g,s)=>{g.fillStyle="#04060d";g.fillRect(0,0,s,s);const c=["#7dd3fc","#f0abfc","#fde68a","#a5b4fc"];for(let y=4;y<s;y+=12)for(let x=4;x<s;x+=12)if(R()<.38){g.fillStyle=c[R()*4|0];g.fillRect(x,y,7,8)}});
const skyTex=makeTex(1024,(g,s)=>{const q=g.createLinearGradient(0,0,0,s);[[0,"#02030a"],[.35,"#0b1233"],[.5,"#3b1363"],[.58,"#7a1f8f"],[.6,"#0a1226"],[1,"#05070f"]].forEach(a=>q.addColorStop(a[0],a[1]));
 g.fillStyle=q;g.fillRect(0,0,s,s);for(let i=0;i<700;i++){g.fillStyle=`rgba(255,255,255,${.2+R()*.8})`;g.fillRect(R()*s,R()*s*.5,R()<.1?2:1,1.5)}
 const m=g.createRadialGradient(700,150,4,700,150,90);m.addColorStop(0,"rgba(255,240,255,1)");m.addColorStop(.2,"rgba(240,171,252,.5)");m.addColorStop(1,"rgba(240,171,252,0)");g.fillStyle=m;g.fillRect(560,10,280,280)});
skyTex.wrapS=skyTex.wrapT=THREE.ClampToEdgeWrapping;

/* ---------- world: sky, wet reflective ground, arena, grounded city ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));scene.add(sky);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshStandardMaterial({map:floorTex,roughness:.5,metalness:.35}));
floor.rotation.x=-PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(B*2,36,0x38bdf8,0x15375e);grid.position.y=.07;grid.material.transparent=true;grid.material.opacity=.45;grid.renderOrder=1;scene.add(grid);
const decal=new THREE.Mesh(new THREE.PlaneGeometry(64,64),new THREE.MeshBasicMaterial({map:makeTex(512,(g,s)=>{g.strokeStyle="#38bdf8";[240,190,120].forEach((r,i)=>{g.globalAlpha=.9-i*.25;g.lineWidth=6;g.beginPath();g.arc(s/2,s/2,r,0,7);g.stroke()});
 g.globalAlpha=.7;g.lineWidth=3;for(let a=0;a<8;a++){const c=M.cos(a*PI/4),n=M.sin(a*PI/4);g.beginPath();g.moveTo(s/2+c*190,s/2+n*190);g.lineTo(s/2+c*240,s/2+n*240);g.stroke()}}),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
decal.rotation.x=-PI/2;decal.position.y=.08;decal.renderOrder=1;scene.add(decal);

const neon=[0x22d3ee,0xe879f9,0xfacc15,0x818cf8].map(bas);
// City blocks on a street grid. Every tower sits on y=0 with a glowing base band, so nothing floats.
function buildCity(){const spots=[],bg=GLB.building;
for(let gx=-5;gx<=5;gx++)for(let gz=-5;gz<=5;gz++){
 const cx=gx*48,cz=gz*48;if(M.max(M.abs(cx),M.abs(cz))<B+36||R()<.2)continue;if(bg){spots.push({x:cx,z:cz,s:.8+R()*.5,ry:(R()*4|0)*PI/2});continue}
 const w=20+R()*14,d=20+R()*14,h=40+R()*70+M.hypot(cx,cz)*.25,t=winTex.clone();t.needsUpdate=true;t.repeat.set(w/9,h/9);
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({map:t,color:0xaab4d8}));b.position.set(cx,h/2,cz);scene.add(b);
 const nm=neon[(gx+gz+10)%4],band=new THREE.Mesh(new THREE.BoxGeometry(w+1,.7,d+1),nm);band.position.set(cx,.35,cz);scene.add(band);
 const ph=h*(.4+R()*.5),pil=new THREE.Mesh(new THREE.BoxGeometry(1.2,ph,1.2),nm);pil.position.set(cx-M.sign(cx||1)*w/2,4+ph/2,cz-M.sign(cz||1)*d/2);scene.add(pil);
}
if(bg&&spots.length)instCity(bg,spots)}
function instCity(bg,spots){const t=bg.scene;t.updateMatrixWorld(true);   // one InstancedMesh per mesh in building.glb, placed on the street grid
 const bb=new THREE.Box3().setFromObject(t),sz=bb.getSize(new V3()),c=bb.getCenter(new V3()),k=30/M.max(sz.x,sz.z),pre=new THREE.Matrix4().makeTranslation(-c.x,-bb.min.y,-c.z),m4=new THREE.Matrix4(),q=new THREE.Quaternion(),Y=new V3(0,1,0),p=new V3(),sc=new V3();
 t.traverse(o=>{if(!o.isMesh||o.isSkinnedMesh)return;const im=new THREE.InstancedMesh(o.geometry,o.material,spots.length);
  spots.forEach((s,i)=>{q.setFromAxisAngle(Y,s.ry);p.set(s.x,0,s.z);sc.setScalar(k*s.s);m4.compose(p,q,sc).multiply(pre).multiply(o.matrixWorld);im.setMatrixAt(i,m4)});im.frustumCulled=false;scene.add(im)})}

// Energy barrier: solid base wall + animated shield field (grid, sweeping pulse, ripples where the player is close)
const bMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
 uniforms:{t:{value:0},pp:{value:new V3()},col:{value:new THREE.Color(0x22d3ee)},col2:{value:new THREE.Color(0xe879f9)}},
 vertexShader:"varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}",
 fragmentShader:`varying vec2 vUv;varying vec3 vW;uniform float t;uniform vec3 pp,col,col2;
 void main(){float L=vW.x+vW.z;vec2 q=abs(fract(vec2(L*.22,vW.y*.4))-.5);
 float g=smoothstep(.44,.5,max(q.x,q.y)),sw=smoothstep(.85,1.,sin(L*.1-t*1.8)*.5+.5);
 float ed=(1.-smoothstep(0.,.1,vUv.y))+smoothstep(.93,1.,vUv.y),nr=1.-smoothstep(3.,34.,distance(vW.xz,pp.xz));
 float a=.06+.3*pow(1.-vUv.y,2.)+g*.16+sw*.22+ed*.8+nr*(.3+g*.6);
 gl_FragColor=vec4(mix(col,col2,.5+.5*sin(L*.04+t*.5))*1.3,clamp(a,0.,1.));}`});
const dark=std(0x0d1424,.4,.9);
[[0,-B,0],[0,B,0],[B,0,PI/2],[-B,0,PI/2]].forEach(([x,z,ry])=>{const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
 const base=new THREE.Mesh(new THREE.BoxGeometry(B*2,1.4,1.6),dark);base.position.y=.7;base.receiveShadow=true;g.add(base);
 const st=new THREE.Mesh(new THREE.BoxGeometry(B*2,.22,1.7),neon[0]);st.position.y=1.45;g.add(st);
 const pane=new THREE.Mesh(new THREE.PlaneGeometry(B*2,7.4),bMat);pane.position.y=5.2;g.add(pane);
 const rail=new THREE.Mesh(new THREE.BoxGeometry(B*2,.16,.16),neon[1]);rail.position.y=8.9;g.add(rail)});
{const N=28,py=new THREE.InstancedMesh(new THREE.BoxGeometry(2.6,10,2.6),dark,N),l1=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,7.5,2.8),neon[0],N),l2=new THREE.InstancedMesh(new THREE.BoxGeometry(2.8,7.5,.5),neon[0],N),mt=new THREE.Matrix4();let n=0;
 for(let i=-3;i<=3;i++){const o=i*30;[[o,-B],[o,B],[-B,o],[B,o]].forEach(([x,z])=>{mt.makeTranslation(x,5,z);[py,l1,l2].forEach(m=>m.setMatrixAt(n,mt));n++})}
 py.castShadow=true;scene.add(py,l1,l2)}

// Power generators (obstacles)
const obs=[{x:-42,z:-28,w:18,d:12,h:7},{x:42,z:-32,w:16,d:13,h:8},{x:-40,z:34,w:20,d:13,h:7},{x:44,z:30,w:18,d:12,h:8},{x:0,z:-56,w:26,d:9,h:9},{x:0,z:56,w:26,d:9,h:9}];
obs.forEach((o,i)=>{const g=new THREE.Group(),t=metalTex.clone();t.needsUpdate=true;t.repeat.set(o.w/8,1);
 const b=new THREE.Mesh(new THREE.BoxGeometry(o.w,o.h,o.d),new THREE.MeshStandardMaterial({map:t,roughness:.45,metalness:.8}));b.position.y=o.h/2;b.castShadow=b.receiveShadow=true;g.add(b);
 const nm=neon[i%2],tr=new THREE.Mesh(new THREE.BoxGeometry(o.w+.5,.6,o.d+.5),nm);tr.position.y=o.h;g.add(tr);
 [-1,1].forEach(s=>[1,-1].forEach(f=>{const st=new THREE.Mesh(new THREE.BoxGeometry(.4,o.h*.6,.2),nm);st.position.set(s*o.w*.3,o.h*.55,f*(o.d/2+.1));g.add(st)}));
 const core=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,1.2,12),new THREE.MeshStandardMaterial({color:0x111827,emissive:i%2?0xe879f9:0x38bdf8,emissiveIntensity:1.5}));core.position.y=o.h+.9;g.add(core);
 g.position.set(o.x,0,o.z);scene.add(g)});
const dg=new THREE.BufferGeometry(),dp=new Float32Array(1800);for(let i=0;i<1800;i+=3){dp[i]=(R()-.5)*200;dp[i+1]=1+R()*40;dp[i+2]=(R()-.5)*200}

/* ---------- audio (synth + optional user soundtracks) ---------- */
let ac=null;const bufs=[];
const initA=()=>{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==="suspended")ac.resume()};
function tone(f,d,v,type,t,k=.4){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(M.max(20,f*k),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}
const SFX={step:[550,.07,"sine",.4],hit:[820,.12,"sine",1.5],miss:[130,.08,"sawtooth",.4],damage:[80,.3,"sawtooth",.4]};
function sfx(t,s=0){initA();if(!ac)return;const a=SFX[t];tone(a[0]+(t==="step"?s*200:0),a[1],.07,a[2],ac.currentTime,a[3])}
function boom(){if(!ac)return;const n=ac.sampleRate*.4|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(R()*2-1)*(1-i/n)**2;
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type="lowpass";f.frequency.value=700;g.gain.value=.3;s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
function milestone(){if(!ac)return;if(bufs.length){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=bufs[R()*bufs.length|0];g.gain.value=.75;s.connect(g);g.connect(ac.destination);s.start()}
 else[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.35,.08,"sine",ac.currentTime+i*.08,1))}
$("audioInput").addEventListener("change",async e=>{const fs=[...e.target.files];if(!fs.length)return;initA();const b=$("audioBtn");b.textContent="⏳ BUFFERING...";
 for(const f of fs)try{bufs.push(await ac.decodeAudioData(await f.arrayBuffer()))}catch(_){}b.textContent=`✅ ${bufs.length} TRACKS`;$("tracks").textContent=bufs.length;milestone()});

/* ---------- characters ----------
 Built-in: one skinned mesh per material on a real 11-bone skeleton, animated by bone rotations.

const bG=new THREE.BoxGeometry(.5,.5,2.6),bM=bas(0xff2a55),swG=new THREE.RingGeometry(.94,1,64),pkG=new THREE.CylinderGeometry(1.3,1.3,.35,6),pkR=new THREE.TorusGeometry(1.9,.14,8,24),pkM=bas(0x22e5ff);

/* ---------- update ---------- */
function updateGame(dt){
 let mx=0,mz=0;if(mv.arrowup)mz--;if(mv.arrowdown)mz++;if(mv.arrowleft)mx--;if(mv.arrowright)mx++;

  if(!hitObs(tx,player.z,player.radius))player.x=tx;if(!hitObs(player.x,tz,player.radius))player.z=tz;want=M.atan2(mx,mz)}

 let sl=false;for(const b of bubbles){b.s.scale.setScalar(1+M.sin(runT*2+b.i)*.025);if(M.hypot(player.x-b.x,player.z-b.z)<b.r*.92&&player.y<b.r*.8)sl=true}
 if(sl!==slowed){slowed=sl;hud()}
 for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];p.t+=dt;p.life-=dt;p.g.rotation.y+=dt*3;p.g.position.y=1.9+M.sin(p.t*3)*.35;
  const got=player.lives<3&&M.hypot(p.x-player.x,p.z-player.z)<player.radius+1.8&&player.y<3.5;
  if(got){player.lives++;hud();sfx("hit");ftext("+1 SHIELD",p.x,5,p.z);sparks(p.x,2,p.z,0x22e5ff,16)}
  if(got||p.life<=0){scene.remove(p.g);pickups.splice(i,1)}}
 const sm=spdMult();
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],dx=player.x-e.x,dz=player.z-e.z,dist=M.hypot(dx,dz)||1,sp=e.T.speed*sm,go=!(e.T.boss&&dist<24);
  if(go){e.x+=dx/dist*sp*dt;e.z+=dz/dist*sp*dt;pushOut(e,e.T.rad*.6)}
  e.mesh.position.set(e.x,0,e.z);e.mesh.rotation.y=M.atan2(dx,dz);e.a.upd(dt,go,false,3+sp*.9);
  e.label.position.set(e.x,e.ly,e.z);e.label.quaternion.copy(camera.quaternion);
  if(e.T.shoot&&dist<62&&(e.sh-=dt)<=0){e.sh=3+R()*2.5;bullet(e,dx/dist,dz/dist)}
  if(e.T.boss&&(e.cd-=dt)<=0){e.cd=M.max(2.8,5-(1-e.hp/e.maxhp)*2);shock(e)}
  if(dist<player.radius+e.T.rad&&player.inv<=0){hurt();if(!e.T.boss){if(lock===e)lock=null;enemies.splice(i,1);dropLabel(e);scene.remove(e.mesh);e.a.free()}}}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i],p=b.m.position;p.x+=b.vx*dt;p.z+=b.vz*dt;b.life-=dt;
  let dead=b.life<=0||M.abs(p.x)>B||M.abs(p.z)>B||hitObs(p.x,p.z,.4);
  if(!dead&&player.inv<=0&&M.hypot(p.x-player.x,p.z-player.z)<player.radius+.5&&player.y<=2){hurt();dead=true}   // player.y>2: the bullet sails underneath
  if(dead){scene.remove(b.m);bullets.splice(i,1)}}
 for(let i=shocks.length-1;i>=0;i--){const s=shocks[i];s.r+=26*dt;s.m.scale.setScalar(s.r);s.m.material.opacity=M.min(1,(150-s.r)/60);
  if(!s.hit&&player.inv<=0&&player.y<1.6&&M.abs(M.hypot(player.x-s.x,player.z-s.z)-s.r)<s.r*.03+1.6){s.hit=true;hurt()}
  if(s.r>150){scene.remove(s.m);s.m.material.dispose();shocks.splice(i,1)}}
 if(wave<3){const n=wave===2?M.min(9,5+((kills-50)/8|0)):M.min(16,6+(kills/4|0));while(enemies.length<n)spawnEnemy()}}
function fxUpdate(dt,rdt){

 pg.position.set(player.x,player.y,player.z);pa.air=player.y>.4;pg.rotation.y=player.angle;pg.visible=over||player.inv<=0||(player.inv*14|0)%2===0;
 pa.upd(dt,player.moving&&!over,!!tg,15);

 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.position.x+=p.vx*dt;p.position.y+=p.vy*dt;p.position.z+=p.vz*dt;p.vy-=28*dt;p.life-=dt;p.scale.setScalar(M.max(.01,p.life/.6));if(p.life<=0||p.position.y<0){scene.remove(p);parts.splice(i,1)}}
 for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;r.scale.setScalar(1+(1-r.life/.5)*10);r.material.opacity=M.max(0,r.life*2);if(r.life<=0){scene.remove(r);r.material.dispose();rings.splice(i,1)}}
 for(let i=dying.length-1;i>=0;i--){const d=dying[i];d.t+=dt;d.e.a.upd(dt,false,false,0);d.e.mesh.scale.setScalar(clamp((1.7-d.t)/.35,0,1));if(d.t>1.7){scene.remove(d.e.mesh);d.e.a.free();dying.splice(i,1)}}

 camBase.x+=(player.x-camBase.x)*k;camBase.y+=(27-c*.12-camBase.y)*k;camBase.z+=(player.z+41-c*.3-camBase.z)*k;shake=M.max(0,shake-rdt*1.8);

 slv+=(clamp((combo-3)/12,0,1)*.7+kick*.45-slv)*M.min(1,rdt*8);kick=M.max(0,kick-rdt*5);slEl.style.opacity=slv.toFixed(2);   // speed lines (CSS overlay)
 let near=null,nd=1e9;for(const e of enemies){const d=(e.x-player.x)**2+(e.z-player.z)**2;if(d<nd){nd=d;near=e}}
 const t=lock&&enemies.includes(lock)?lock:near,ch=t?t.seq[t.ti]:"-",txt=ch===" "?"␣":ch;if(elTk.textContent!==txt)elTk.textContent=txt}

/* ---------- lifecycle, quality governor, loop ---------- */
function endGame(win){over=true;lock=null;if(!win)pa.die();const id=runId;$("goT").textContent=win?"SYSTEM SECURED":"CRITICAL OVERLOAD";$("goT").style.color=win?"#4ade80":"#f87171";
 setTimeout(()=>{if(over&&id===runId){$("finalScore").textContent=`Hostiles down: ${kills}  •  Score: ${score}`;$("gameOver").classList.add("show")}},win?2300:1100)}
function resetGame(){
 runId++;over=false;wave=1;boss=null;slowed=false;score=kills=combo=0;comboT=runT=0;sec=-1;lock=face=null;faceT=beamT=pulse=0;shake=hitStop=kick=0;elTime.textContent="00:00";
 Object.assign(player,{x:0,z:0,y:0,vy:0,lives:3,inv:0,angle:0,moving:false});

 if(pa){pg.remove(pa.root);pa.free()}pa=mkActor("player",PLAYER_P);pg.add(pa.root);gunObj=null;mountGun();

function loop(now){
 const raw=now-last;last=now;const rdt=M.min(.033,raw/1000);let dt=rdt;
 if(hitStop>0){hitStop-=rdt;dt*=.03}

camera.position.copy(camBase);
